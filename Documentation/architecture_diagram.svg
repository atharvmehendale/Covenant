<svg viewBox="0 0 1200 1000" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="1000" fill="#f8fafc"/>

  <!-- Title -->
  <text x="600" y="45" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">Covenant — Compliance Enforcer Agent</text>
  <text x="600" y="72" text-anchor="middle" font-size="15" fill="#64748b">Architecture — built with the Strands Agents SDK, running on Groq (Bedrock wired up, not yet deployed)</text>

  <!-- Runtime boundary. Labelled as what it IS today (a local/CI process),
       with AgentCore named as the planned target rather than current state. -->
  <rect x="40" y="100" width="1120" height="810" rx="14" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8,6"/>
  <text x="60" y="128" font-size="14" font-weight="700" fill="#475569">Local / CI process boundary — runs via monitor.py or GitHub Actions <tspan font-weight="400" font-style="italic">(planned target: Amazon Bedrock AgentCore)</tspan></text>

  <!-- INPUT LAYER -->
  <rect x="80" y="155" width="260" height="80" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="210" y="185" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Inbox Folder</text>
  <text x="210" y="204" text-anchor="middle" font-size="12" fill="#475569">Incoming JV drafts,</text>
  <text x="210" y="219" text-anchor="middle" font-size="12" fill="#475569">contracts, filings</text>

  <rect x="860" y="155" width="260" height="80" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="990" y="185" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Public Policy Document</text>
  <text x="990" y="204" text-anchor="middle" font-size="12" fill="#475569">Company's own public</text>
  <text x="990" y="219" text-anchor="middle" font-size="12" fill="#475569">sustainability / compliance code</text>

  <!-- MONITOR -->
  <rect x="410" y="155" width="380" height="80" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="600" y="185" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Background Monitor (monitor.py)</text>
  <text x="600" y="204" text-anchor="middle" font-size="12" fill="#1e40af">Scans inbox continuously — silent when</text>
  <text x="600" y="219" text-anchor="middle" font-size="12" fill="#1e40af">clean, triggers review only when new drafts arrive</text>

  <line x1="210" y1="235" x2="500" y2="270" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="990" y1="235" x2="700" y2="270" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="235" x2="600" y2="270" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ORCHESTRATOR -->
  <rect x="380" y="275" width="440" height="100" rx="12" fill="#0f172a"/>
  <text x="600" y="308" text-anchor="middle" font-size="16" font-weight="700" fill="#f8fafc">Orchestrator Agent</text>
  <text x="600" y="328" text-anchor="middle" font-size="12" fill="#cbd5e1">Strands Agent — decides which tool to call and when.</text>
  <text x="600" y="344" text-anchor="middle" font-size="12" fill="#cbd5e1">Not a fixed script: the model chooses the sequence.</text>
  <text x="600" y="362" text-anchor="middle" font-size="11" font-style="italic" fill="#93c5fd">Powered by gpt-oss-120b (via Groq)</text>

  <line x1="600" y1="375" x2="600" y2="410" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- TOOL AGENTS ROW -->
  <text x="600" y="405" text-anchor="middle" font-size="12" font-weight="700" fill="#64748b">calls, in sequence, as tools:</text>

  <!-- Reader -->
  <rect x="120" y="425" width="280" height="130" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="260" y="452" text-anchor="middle" font-size="15" font-weight="700" fill="#065f46">① Reader</text>
  <text x="260" y="474" text-anchor="middle" font-size="11.5" fill="#047857">Reads policy + draft documents.</text>
  <text x="260" y="491" text-anchor="middle" font-size="11.5" fill="#047857">Extracts facts and commitments only —</text>
  <text x="260" y="508" text-anchor="middle" font-size="11.5" fill="#047857">never judges or interprets.</text>
  <text x="260" y="533" text-anchor="middle" font-size="10.5" font-style="italic" fill="#059669">reader_agent.py</text>

  <!-- Reasoner -->
  <rect x="460" y="425" width="280" height="130" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="600" y="452" text-anchor="middle" font-size="15" font-weight="700" fill="#92400e">② Reasoner</text>
  <text x="600" y="474" text-anchor="middle" font-size="11.5" fill="#b45309">Takes the Reader's facts and judges</text>
  <text x="600" y="491" text-anchor="middle" font-size="11.5" fill="#b45309">whether the draft contradicts a</text>
  <text x="600" y="508" text-anchor="middle" font-size="11.5" fill="#b45309">commitment in the policy.</text>
  <text x="600" y="533" text-anchor="middle" font-size="10.5" font-style="italic" fill="#b45309">reasoner_agent.py</text>

  <!-- Writer -->
  <rect x="800" y="425" width="280" height="130" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="940" y="452" text-anchor="middle" font-size="15" font-weight="700" fill="#5b21b6">③ Writer</text>
  <text x="940" y="474" text-anchor="middle" font-size="11.5" fill="#6d28d9">Turns the Reasoner's verdict into a</text>
  <text x="940" y="491" text-anchor="middle" font-size="11.5" fill="#6d28d9">proposed redline and a plain-English</text>
  <text x="940" y="508" text-anchor="middle" font-size="11.5" fill="#6d28d9">escalation memo.</text>
  <text x="940" y="533" text-anchor="middle" font-size="10.5" font-style="italic" fill="#6d28d9">writer_agent.py</text>

  <line x1="600" y1="410" x2="260" y2="425" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="600" y1="410" x2="600" y2="425" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="600" y1="410" x2="940" y2="425" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- shared model layer. Labelled with the provider actually in use; Bedrock
       is implemented in model_provider.py but not the live path. -->
  <rect x="330" y="575" width="540" height="66" rx="10" fill="#1e3a8a"/>
  <text x="600" y="598" text-anchor="middle" font-size="13" font-weight="700" fill="#dbeafe">Groq — gpt-oss-120b</text>
  <text x="600" y="615" text-anchor="middle" font-size="11" fill="#bfdbfe">Shared foundation model powering all four agents above</text>
  <text x="600" y="631" text-anchor="middle" font-size="10" font-style="italic" fill="#93c5fd">Amazon Bedrock (Nova Pro) wired up in model_provider.py — planned, not yet deployed</text>

  <line x1="260" y1="555" x2="500" y2="575" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="600" y1="555" x2="600" y2="575" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="940" y1="555" x2="700" y2="575" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3"/>

  <line x1="940" y1="555" x2="940" y2="670" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrowAmber)"/>

  <!-- DECISION POINT -->
  <polygon points="940,670 1060,720 940,770 820,720" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
  <text x="940" y="715" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412">Contradiction</text>
  <text x="940" y="731" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412">found?</text>

  <!-- NO branch -->
  <line x1="820" y1="720" x2="260" y2="720" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="540" y="710" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">No</text>
  <rect x="120" y="690" width="280" height="60" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="260" y="716" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">Stays silent</text>
  <text x="260" y="734" text-anchor="middle" font-size="11" fill="#64748b">No human interrupted</text>

  <!-- YES branch -->
  <text x="960" y="795" font-size="12" font-weight="700" fill="#b45309">Yes</text>
  <line x1="940" y1="770" x2="940" y2="815" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrowAmber)"/>

  <rect x="780" y="820" width="320" height="90" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="940" y="848" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">Escalation to Human</text>
  <text x="940" y="867" text-anchor="middle" font-size="11" fill="#b91c1c">Proposed redline + memo sent to</text>
  <text x="940" y="883" text-anchor="middle" font-size="11" fill="#b91c1c">Compliance Officer — status:</text>
  <text x="940" y="899" text-anchor="middle" font-size="11" font-weight="700" fill="#7f1d1d">PENDING HUMAN APPROVAL</text>

  <!-- LOG (both branches feed it) -->
  <rect x="120" y="820" width="600" height="90" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="420" y="850" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Permanent Scan Log (scan_log.jsonl)</text>
  <text x="420" y="870" text-anchor="middle" font-size="11" fill="#64748b">Every document ever scanned is recorded — clean or</text>
  <text x="420" y="887" text-anchor="middle" font-size="11" fill="#64748b">flagged — building a running compliance history over time</text>

  <line x1="260" y1="750" x2="360" y2="820" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="880" y1="910" x2="700" y2="910" stroke="#b45309" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- legend -->
  <text x="60" y="945" font-size="11" fill="#64748b">Nothing is ever auto-applied to a document — every fix is a proposal awaiting explicit human sign-off.</text>
</svg>
